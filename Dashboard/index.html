<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omicron-Nu dashboard</title>
<meta name="description" content="Key Result Areas and this week's events for the Omicron-Nu Chapter of Tau Kappa Epsilon.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#AD2624">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Omicron-Nu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<script>if (/[?&]tv(=|&|$)/.test(location.search)) document.documentElement.className = 'tv';</script>
<style>
  /* TKE brand standards (Official TKE Communication, Brand & Style Guide):
     TKE cherry PMS 1805C #AD2624, TKE gray Cool Gray 9C #919194, black, white.
     Type: Lato. Houseplate: black on white for members, white on solid black
     for the TV (the same white file tkeon.fit's header uses); never gray.
     Members' view is light, like tkeon.fit. The TV is dark: less glare in the
     chapter room and less wear on a screen that stays on all day.
     Written for older smart-TV browsers too: no flex gap, inset, clamp-only
     sizes, optional chaining or other newer syntax. */
  :root {
    --cherry: #AD2624;
    --tke-gray: #919194;
    --bg: #F4F4F5;
    --panel: #FFFFFF;
    --panel-2: #F6F6F7;
    --line: #E1E1E4;
    --track: #E4E4E8;
    --text: #131315;
    --muted: #5A5A5E;
    --faint: #747478;
    --mark: #AD2624;         /* cherry, for the headline meter and trend line */
    --met: #2F8F5B;          /* status colours always come with an icon and a label */
    --behind: #C77A00;
    --none: #9A9A9E;
    --neutral: #4A4A4F;      /* points bars: plain ink, so status colour stays meaningful */
    --head-bg: #FFFFFF;
    --head-text: #131315;
    --head-muted: #5A5A5E;
    --radius: 0.75rem;
    --font: "Lato", "Helvetica Neue", Arial, sans-serif;
  }
  html.tv {
    --bg: #000000;         /* solid black: the only background the white houseplate may sit on */
    --panel: #161618;
    --panel-2: #1F1F22;
    --line: #2C2C30;
    --track: #303035;
    --text: #F6F6F7;
    --muted: #B7B7BB;
    --faint: #919194;
    --mark: #C9302C;         /* cherry, one step lighter so it holds 3:1 on black */
    --met: #4DB37E;
    --behind: #FFB20F;       /* TKE secondary gold, PMS 1235C */
    --none: #6E6E73;
    --neutral: #D5D5D8;
    --head-bg: #000000;
    --head-text: #FFFFFF;
    --head-muted: #B7B7BB;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  /* TV: every size scales off the screen, so 1080p and 4K are the same layout. */
  html.tv { font-size: 1.0417vw; cursor: none; }
  @supports (font-size: min(1vw, 1vh)) { html.tv { font-size: min(1.0417vw, 1.852vh); } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.4 var(--font); }
  html.tv, html.tv body { height: 100%; overflow: hidden; }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { font-weight: 700; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .eyebrow { color: var(--muted); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .panel { background: var(--panel); border-radius: var(--radius); border: 1px solid var(--line); min-width: 0; }
  html.tv .panel { border-color: transparent; }

  .s-met, .s-ontrack { --sc: var(--met); }
  .s-behind { --sc: var(--behind); }
  .s-none { --sc: var(--none); }
  .ico { display: block; width: 1.5rem; height: 1.5rem; flex: none; }

  /* Meters. The fill grows in when a screen appears. */
  .meter { position: relative; display: block; height: 0.6rem; }
  .meter .track { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--track); border-radius: 999px; overflow: hidden; }
  .fill { display: block; height: 100%; background: var(--sc); border-radius: 0 4px 4px 0; transform-origin: 0 50%; animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .tick { position: absolute; top: -0.25rem; bottom: -0.25rem; width: 3px; margin-left: -1.5px; background: var(--text); border-radius: 2px; box-shadow: 0 0 0 2px var(--panel); }
  .tick-key { display: inline-block; width: 3px; height: 0.9em; margin-right: 0.55em; background: var(--text); border-radius: 2px; vertical-align: -0.1em; }
  .pbar { display: block; height: 0.5rem; background: var(--track); border-radius: 999px; overflow: hidden; }
  .pbar .fill { background: var(--neutral); }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ---------- Header ---------- */
  #stage { min-height: 100%; }
  html.tv #stage { height: 100%; display: flex; flex-direction: column; padding: 1.3rem 2.4rem 1.1rem; }
  .top { display: flex; align-items: center; background: var(--head-bg); color: var(--head-text); padding: 0.7rem 1rem; }
  html.tv .top { padding: 0 0 1rem; background: none; border-bottom: 3px solid var(--cherry); flex: none; }
  .brand { display: flex; align-items: center; min-width: 0; flex: 1 1 auto; }
  /* Both files have clear space built in around the houseplate; keep it. */
  .logo-wrap { display: block; flex: none; margin-right: 0.6rem; }
  .logo { display: block; height: 3.4rem; width: 3.4rem; }
  .logo-on-dark, html.tv .logo-on-light { display: none; }
  html.tv .logo-on-dark { display: block; }
  .brand > div { min-width: 0; }
  .chapter { font-size: 1.35rem; line-height: 1.15; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--head-muted); font-size: 0.8rem; margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 700px) { html:not(.tv) .chapter { font-size: 1.1rem; } }
  @media (max-width: 360px) { html:not(.tv) .chapter { font-size: 0.92rem; } html:not(.tv) .logo-wrap { margin-right: 0.35rem; } }
  html.tv .logo { height: 5.6rem; width: 5.6rem; }
  html.tv .logo-wrap { margin: -0.7rem 0.7rem -0.7rem -0.5rem; }
  html.tv .chapter { font-size: 2.2rem; }
  html.tv .sub { font-size: 1rem; }

  .clock { display: none; text-align: right; flex: none; }
  html.tv .clock { display: block; }
  .clock-time { font-weight: 900; font-size: 2.7rem; line-height: 1; }
  .clock-date { color: var(--head-muted); font-size: 1.05rem; margin-top: 0.25rem; }

  /* National and regional KRA rank: in the TV header, a bar under the tabs for members. */
  .ranks { min-width: 0; }
  .ranks:empty { display: none; }
  .rk { display: flex; align-items: center; }
  .rk-item { flex: none; margin-right: 1.5rem; }
  .rk-label { display: block; color: var(--muted); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .rk-num { display: block; font-weight: 900; font-size: 1.6rem; line-height: 1.15; white-space: nowrap; }
  .rk-num span { font-size: 0.55em; font-weight: 700; color: var(--muted); }
  .rk-moves { color: var(--muted); font-size: 0.85rem; line-height: 1.45; white-space: nowrap; min-width: 0; }
  .rk-move { display: block; }
  html:not(.tv) .ranks { max-width: 1180px; margin: 0.9rem auto 0; padding: 0 1rem; }
  html:not(.tv) .rk { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.7rem 0.9rem; flex-wrap: wrap; }
  @media (max-width: 560px) {
    html:not(.tv) .rk-moves { flex-basis: 100%; margin-top: 0.45rem; white-space: normal; }
    html:not(.tv) .rk-move { display: inline-block; margin-right: 1rem; }
  }
  html.tv .ranks { flex: none; margin: 0 2.2rem; }
  html.tv .rk-item { margin-right: 2.4rem; }
  html.tv .rk-label { font-size: 0.9rem; color: var(--head-muted); }
  html.tv .rk-num { font-size: 2.6rem; }
  html.tv .rk-moves { font-size: 1.1rem; color: var(--head-muted); }

  /* Next event, with a countdown: at the top of the This week screen. */
  .nextup { min-width: 0; }
  .nextup:empty { display: none; }
  .nu { display: flex; align-items: center; min-width: 0; }
  .nu-label { flex: none; margin-right: 0.75rem; padding: 0.3rem 0.6rem; border-radius: 0.3rem; background: var(--cherry); color: #fff; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .nu-body { min-width: 0; }
  .nu-title { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nu-meta { display: block; color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html:not(.tv) .nextup { flex-basis: 100%; margin-top: 0.8rem; }
  html:not(.tv) .nu { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.65rem 0.8rem; }
  html.tv .nextup { margin-left: auto; max-width: 46rem; }
  html.tv .nu-label { font-size: 0.9rem; padding: 0.4rem 0.75rem; margin-right: 1rem; }
  html.tv .nu-title { font-size: 1.5rem; line-height: 1.15; }
  html.tv .nu-meta { font-size: 1.1rem; }

  .tabs { display: flex; position: -webkit-sticky; position: sticky; top: 0; z-index: 5; background: var(--head-bg); border-bottom: 1px solid var(--line); padding: 0 0.5rem; }
  html.tv .tabs { display: none; }
  .tab { -webkit-appearance: none; appearance: none; flex: 1 1 0; max-width: 14rem; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); cursor: pointer; font: 700 0.95rem/1.1 var(--font); min-height: 44px; padding: 0.6rem 0.4rem 0.5rem; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--cherry); }
  .tab:focus-visible { outline: 2px solid var(--cherry); outline-offset: -2px; }
  .account { flex: none; margin-left: 0.6rem; }
  html.tv .account { display: none; }
  .gtabs, .subtabs { display: none; }
  html:not(.can-recruit) .needs-recruit { display: none !important; } /* the Recruitment tab, until an admin lets you in */
  /* Phones: three tabs in a bottom bar, like a native app (KRA, This week,
     Goals). KRA shows the scoreboard with required & bonus under it; Goals has
     a Goals | Board switch at the top. The page keeps clear of the notch and
     the home indicator. Desktop keeps one tab per screen at the top. */
  @media (max-width: 700px) {
    html:not(.tv) body { padding-bottom: 4.2rem; padding-bottom: calc(3.9rem + env(safe-area-inset-bottom, 0px)); }
    html:not(.tv) .top { padding-top: calc(0.7rem + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
    html:not(.tv) .tabs { display: none; }
    html:not(.tv) .gtabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; padding: 0 0.4rem; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--head-bg); border-top: 1px solid var(--line); }
    .gtab { -webkit-appearance: none; appearance: none; flex: 1 1 0; min-height: 3.6rem; padding: 0.4rem 0.1rem 0.35rem; background: none; border: 0; border-top: 3px solid transparent; color: var(--muted); cursor: pointer; font: 700 0.72rem/1.1 var(--font); -webkit-tap-highlight-color: transparent; }
    .gtab[aria-selected="true"] { border-top-color: var(--cherry); color: var(--cherry); }
    .gtab:focus-visible, .subtab:focus-visible { outline: 2px solid var(--cherry); outline-offset: -2px; }
    .gtab svg { display: block; width: 1.5rem; height: 1.5rem; margin: 0 auto 0.15rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    html:not(.tv) .subtabs:not(:empty) { display: flex; margin: 0.9rem 1rem 0; padding: 0.2rem; background: var(--track); border-radius: 0.7rem; }
    .subtab { -webkit-appearance: none; appearance: none; flex: 1 1 0; min-height: 38px; padding: 0.3rem 0.5rem; background: none; border: 0; border-radius: 0.55rem; color: var(--muted); cursor: pointer; font: 700 0.9rem/1.1 var(--font); -webkit-tap-highlight-color: transparent; }
    .subtab[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); }
    html:not(.tv) #scene-required:not([hidden]) { margin-top: 1rem; } /* sits under the scoreboard in the KRA tab */
    html:not(.tv) .ranks.not-kra { display: none; } /* on a phone the rankings show only in the KRA tab */
  }

  .notices { max-width: 1180px; margin: 0 auto; padding: 0 1rem; }
  .notices:empty { display: none; }
  html.tv .notices { max-width: none; margin: 0; padding: 0; flex: none; }
  .notice { margin-top: 0.75rem; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--faint); border-radius: 0.4rem; padding: 0.5rem 0.8rem; font-size: 0.9rem; word-wrap: break-word; }
  .notice.warn { border-left-color: var(--behind); }
  .notice.bad { border-left-color: var(--cherry); }
  html.tv .notice { font-size: 1.05rem; border-color: transparent; border-left: 4px solid var(--faint); }
  html.tv .notice.warn { border-left-color: var(--behind); }

  main { max-width: 1180px; margin: 0 auto; padding: 1rem; }
  html.tv main { flex: 1 1 0; min-height: 0; position: relative; max-width: none; margin: 1.1rem 0 0; padding: 0; }
  .scene { min-width: 0; }
  html.tv .scene { position: absolute; left: 0; right: 0; top: 0; bottom: 0; opacity: 0; transition: opacity 0.6s ease; }
  html.tv .scene.is-active { opacity: 1; }
  html.tv .scene:not(.is-active) .fill { animation: none; }
  .empty { color: var(--muted); }

  /* ---------- Screen 1: scoreboard ---------- */
  .board { display: grid; grid-template-columns: minmax(0, 1fr); grid-gap: 1rem; }
  @media (min-width: 900px) { html:not(.tv) .board { grid-template-columns: 21rem minmax(0, 1fr); align-items: start; } }
  html.tv .board { height: 100%; grid-template-columns: 29rem minmax(0, 1fr); grid-gap: 1.4rem; }
  .side { display: grid; grid-template-columns: minmax(0, 1fr); grid-gap: 1rem; min-width: 0; }
  html.tv .side { grid-template-rows: auto auto minmax(0, 1fr); grid-gap: 1.1rem; min-height: 0; }
  /* No trend panel yet (under two days of history): the total fills the column instead. */
  html.tv .side.no-trend { grid-template-rows: minmax(0, 1fr) auto; }
  html.tv .side.no-trend .hero { display: flex; flex-direction: column; justify-content: center; }

  .hero { padding: 1.1rem 1.2rem 1.2rem; }
  .hero-num { font-weight: 900; font-size: 4.4rem; line-height: 1; margin: 0.35rem 0 0.9rem; letter-spacing: -0.01em; }
  .hero-num span { font-size: 0.45em; font-weight: 700; color: var(--muted); margin-left: 0.1em; }
  .hero .meter { height: 1rem; }
  .hero .fill { background: var(--mark); }
  .hero-cap { display: flex; justify-content: space-between; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; margin-top: 0.8rem; }
  .hero-cap > span { margin-right: 0.75rem; }
  .hero-cap > span:last-child { margin-right: 0; }
  html.tv .hero { padding: 1.3rem 1.5rem 1.4rem; }
  html.tv .eyebrow { font-size: 0.95rem; }
  html.tv .hero-num { font-size: 6.6rem; margin: 0.4rem 0 1.1rem; }
  html.tv .hero .meter { height: 1.3rem; }
  html.tv .hero-cap { font-size: 1.1rem; margin-top: 0.95rem; }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-gap: 0.6rem; }
  .tile { padding: 0.75rem 0.8rem 0.8rem; }
  .tile-num { font-weight: 900; font-size: 1.5rem; line-height: 1.1; margin: 0.2rem 0 0.5rem; white-space: nowrap; }
  .tile-num span { font-size: 0.6em; font-weight: 700; color: var(--muted); }
  .tile-cap { color: var(--muted); font-size: 0.8rem; margin-top: 0.45rem; }
  html.tv .tiles { grid-gap: 1.1rem; }
  html.tv .tile { padding: 1rem 1.1rem; }
  html.tv .tile-num { font-size: 2.1rem; }
  html.tv .tile-cap { font-size: 1rem; }
  html.tv .tile .pbar { height: 0.6rem; }

  .trend { padding: 1rem 1.2rem 0.9rem; display: flex; flex-direction: column; min-height: 0; }
  .trend-head { display: flex; justify-content: space-between; align-items: baseline; }
  .chart { margin-top: 1.6rem; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .plot { position: relative; height: 8.5rem; flex: 1 1 auto; min-height: 5rem; touch-action: pan-y; }
  .plot svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  .plot .grid { stroke: var(--line); stroke-width: 1; }
  .plot .line { fill: none; stroke: var(--mark); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .plot .area { fill: var(--mark); fill-opacity: 0.12; }
  .ylab { position: absolute; left: 0; color: var(--faint); font-size: 0.75rem; line-height: 1; transform: translateY(-115%); }
  .dot { position: absolute; width: 0.65rem; height: 0.65rem; margin: -0.325rem 0 0 -0.325rem; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--panel); }
  .endlab { position: absolute; right: 0; font-weight: 700; font-size: 0.9rem; line-height: 1; transform: translateY(-190%); }
  .cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--faint); }
  .tip { position: absolute; top: 0; padding: 0.25rem 0.5rem; border-radius: 0.3rem; background: var(--text); color: var(--panel); font-size: 0.8rem; white-space: nowrap; pointer-events: none; }
  .xaxis { display: flex; justify-content: space-between; color: var(--faint); font-size: 0.75rem; margin-top: 0.35rem; }
  html.tv .trend { padding: 1.2rem 1.5rem 1.1rem; }
  html.tv .ylab, html.tv .xaxis { font-size: 0.95rem; }
  html.tv .endlab { font-size: 1.15rem; }
  html.tv .plot .line { stroke-width: 3; }

  .ktable { padding: 0.4rem 1.1rem 0.5rem; }
  html.tv .ktable { display: flex; flex-direction: column; min-height: 0; padding: 0.7rem 1.5rem 0.6rem; }
  .khead, .krow { display: grid; grid-template-columns: 1.5rem minmax(0, 1.25fr) minmax(0, 1.5fr) minmax(0, 1fr); grid-column-gap: 1rem; align-items: center; }
  .khead { color: var(--muted); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
  .khead .key { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 0.6rem; white-space: nowrap; }
  .krow { padding: 0.8rem 0; border-bottom: 1px solid var(--line); min-height: 0; }
  .krow:last-child { border-bottom: 0; }
  .k-title { display: block; font-weight: 700; font-size: 1.05rem; line-height: 1.2; word-wrap: break-word; }
  .k-status { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }
  .k-note { display: block; color: var(--faint); font-size: 0.8rem; }
  .k-val { margin-bottom: 0.4rem; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-val b { font-weight: 900; font-size: 1.35rem; }
  .k-val b.is-text { font-weight: 700; font-size: 1.05rem; color: var(--muted); }
  .k-val span { color: var(--muted); font-size: 0.9rem; }
  .k-ptsnum { margin-bottom: 0.4rem; line-height: 1.15; white-space: nowrap; }
  .k-ptsnum b { font-weight: 900; font-size: 1.35rem; }
  .k-ptsnum span { color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 700px) {
    html:not(.tv) .khead { display: none; }
    html:not(.tv) .krow { grid-template-columns: 1.5rem minmax(0, 1fr) auto; grid-row-gap: 0.6rem; align-items: start; }
    html:not(.tv) .k-prog { grid-column: 1 / -1; grid-row: 2; }
    html:not(.tv) .k-pts { grid-column: 3; grid-row: 1; text-align: right; }
    html:not(.tv) .k-pts .pbar { display: none; }
    html:not(.tv) .k-ptsnum { margin: 0; }
    html:not(.tv) .k-ptsnum b { font-size: 1.15rem; }
    html:not(.tv) .ktable { padding: 0.2rem 0.9rem; }
    html:not(.tv) .hero-num { font-size: 3.8rem; }
  }
  html.tv .khead, html.tv .krow { grid-template-columns: 2.1rem minmax(0, 1.3fr) minmax(0, 1.5fr) minmax(0, 1fr); grid-column-gap: 1.4rem; }
  html.tv .khead { font-size: 0.9rem; padding: 0.5rem 0 0.7rem; flex: none; }
  html.tv .krows { flex: 1 1 0; min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); }
  html.tv .krow { padding: 0; overflow: hidden; }
  html.tv .ico { width: 2.1rem; height: 2.1rem; }
  html.tv .k-title { font-size: 1.55rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html.tv .k-status { font-size: 1.05rem; }
  html.tv .k-note { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html.tv .k-val b, html.tv .k-ptsnum b { font-size: 1.9rem; }
  html.tv .k-val b.is-text { font-size: 1.4rem; }

// ---------- Formatting ----------

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); };
const fmtNum = function (n, max) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: max == null ? 2 : max }); };

const fmtWhen = function (t) {
  const d = new Date(t);
  return d.toDateString() === new Date().toDateString() ? fmtTime(d) : fmtDay(d) + ', ' + fmtTime(d);
};
function fmtRange(s, e) {
  const a = fmtTime(s), b = fmtTime(e);
  return (a.slice(-2) === b.slice(-2) ? a.slice(0, -3) : a) + '–' + b;
}

const startOfDay = function (t) { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = function (d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); };

const clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };

function fmtValue(k, which) {
  const n = which === 'current' ? k.current : k.goal;
  if (n == null) return null;
  if (k.kind === 'boolean') return n ? 'Done' : 'Not done';
  const frac = function (v) { return v != null && Math.abs(v % 1) > 1e-9; };
  const dp = frac(k.current) || frac(k.goal) ? 2 : 0;
  const s = Number(n).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return k.kind === 'currency' ? '$' + s : s;
}

// ---------- Status, pace and totals ----------

/** Share of the KRA window that has passed (0..1), or null without dates. */
function paceOf(k, now) {
  if (!k.term_start || !k.due_date || k.kind === 'boolean' || !(k.goal > 0)) return null;
  const s = new Date(k.term_start + 'T00:00:00').getTime();
  const e = new Date(k.due_date + 'T23:59:59').getTime();
  if (!(e > s)) return null;
  return clamp((now - s) / (e - s), 0, 1);
}

function statusOf(k, now) {
  if (k.met) return { key: 'met', label: 'Met' };
  if (k.kind === 'boolean') return k.current == null ? { key: 'none', label: 'Not reported' } : { key: 'behind', label: 'Not done' };

  if (pace != null) return k.current / k.goal + 0.02 >= pace ? { key: 'ontrack', label: 'On pace' } : { key: 'behind', label: 'Behind pace' };

}

function totals(kras) {

      met: rows.filter(function (k) { return k.met; }).length,
    };
    t.all.points = round2(t.all.points + t[s].points);
  });
  return t;
}

/** The KRA year, read from the dates set on the cumulative KRAs. */
function yearInfo(kras, now) {
  for (let i = 0; i < kras.length; i++) {
    const k = kras[i];

}

const ICONS = {

  const days = Object.keys(byDay).sort();
  if (days.length < 2) return ''; // not enough history for a line yet: the panel stays hidden
  const pts = days.map(function (d) { return { day: d, t: new Date(d + 'T12:00:00').getTime(), v: round2(byDay[d]) }; });
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const yMax = niceMax(Math.max.apply(null, pts.map(function (p) { return p.v; })) * 1.12);
  pts.forEach(function (p) { p.x = (p.t - t0) / (t1 - t0) * 100; p.y = 100 - p.v / yMax * 100; });
  const d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(2) + ',' + p.y.toFixed(2); }).join('');
  const last = pts[pts.length - 1];
  const ticks = [0, yMax / 2, yMax];
  const data = pts.map(function (p) { return [fmtDay(new Date(p.t)), fmtPts(p.v), +p.x.toFixed(2)]; });
  return '<div class="chart"><div class="plot" data-points="' + esc(JSON.stringify(data)) + '" role="img" aria-label="KRA total by day: ' + fmtPts(pts[0].v) + ' on ' + esc(fmtDay(new Date(t0))) + ', ' + fmtPts(last.v) + ' now">' +
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
      ticks.map(function (v) { const y = (100 - v / yMax * 100).toFixed(2); return '<line class="grid" x1="0" x2="100" y1="' + y + '" y2="' + y + '" vector-effect="non-scaling-stroke"/>'; }).join('') +
      '<path class="area" d="' + d + 'L100,100L0,100Z"/><path class="line" d="' + d + '" vector-effect="non-scaling-stroke"/></svg>' +
    ticks.slice(1).map(function (v) { return '<span class="ylab" style="top:' + (100 - v / yMax * 100).toFixed(1) + '%">' + fmtNum(v, 1) + '</span>'; }).join('') +
    '<span class="dot" style="left:100%;top:' + last.y.toFixed(1) + '%"></span>' +
    '<span class="endlab" style="top:' + last.y.toFixed(1) + '%">' + fmtPts(last.v) + '</span>' +
    '<span class="cross" hidden></span><span class="tip" hidden></span></div>' +
    '<div class="xaxis"><span>' + esc(fmtDay(new Date(t0))) + '</span><span>' + esc(fmtDay(new Date(t1))) + '</span></div></div>';
}

// Members: point at the trend line to read any day.
function wireCharts() {
  if (TV || !window.PointerEvent) return;
  Array.prototype.forEach.call(document.querySelectorAll('.plot[data-points]'), function (plot) {
    const pts = JSON.parse(plot.getAttribute('data-points'));
    const cross = plot.querySelector('.cross'), tip = plot.querySelector('.tip');
    const hide = function () { cross.hidden = true; tip.hidden = true; };
    const move = function (ev) {
      const r = plot.getBoundingClientRect();
      const x = clamp((ev.clientX - r.left) / r.width * 100, 0, 100);
      let best = pts[0];
      pts.forEach(function (p) { if (Math.abs(p[2] - x) < Math.abs(best[2] - x)) best = p; });
      cross.style.left = best[2] + '%';
      tip.textContent = best[0] + ': ' + best[1];
      cross.hidden = false; tip.hidden = false;
      const w = tip.offsetWidth, px = best[2] / 100 * r.width;
      tip.style.left = clamp(px - w / 2, 0, r.width - w) + 'px';
    };
    plot.addEventListener('pointermove', move);
    plot.addEventListener('pointerdown', move);
    plot.addEventListener('pointerleave', hide);
  });
}

// ---------- Screen 1: scoreboard ----------

function kraRow(k, now, maxOut) {
  const st = statusOf(k, now);
  const cur = fmtValue(k, 'current');
  const goal = k.kind === 'boolean' ? null : fmtValue(k, 'goal');
  const pace = paceOf(k, now);
  const fill = k.kind === 'boolean' ? (k.current ? 100 : 0) : (k.goal > 0 && k.current != null ? clamp(k.current / k.goal * 100, 0, 100) : (k.met ? 100 : 0));
  // A zero goal (Finances: owe nationals nothing) isn't a target to count up to.
  const sub = k.kind === 'boolean' ? '' : goal == null ? 'No goal set' : cur == null || k.goal === 0 ? 'Goal ' + goal : 'of ' + goal;
  const ptsPct = k.out_of > 0 ? (Number(k.points) || 0) / k.out_of * 100 : 0;
  const barW = maxOut > 0 ? Math.max(8, (Number(k.out_of) || 0) / maxOut * 100) : 100;
  const label = Math.round(fill) + '% of goal' + (pace != null ? '; on pace would be ' + Math.round(pace * 100) + '%' : '');
  return '<div class="krow s-' + st.key + '">' + ICONS[st.key] +
    '<div class="k-name"><span class="k-title">' + esc(k.name) + '</span><span class="k-status">' + st.label + '</span>' + (k.note ? '<span class="k-note">' + esc(k.note) + '</span>' : '') + '</div>' +
    '<div class="k-prog"><div class="k-val"><b' + (cur == null ? ' class="is-text"' : '') + '>' + esc(cur == null ? 'Not reported' : cur) + '</b>' + (sub ? ' <span>' + esc(sub) + '</span>' : '') + '</div>' + meter(fill, pace, label) + '</div>' +
    '<div class="k-pts"><div class="k-ptsnum"><b>' + fmtPts(k.points) + '</b><span>/' + fmtPts(k.out_of) + ' pts</span></div>' + pbar(ptsPct, barW) + '</div>' +
  '</div>';
}

function renderKras(d, now) {
  const t = totals(d.kras);
  const kras = t.kra.rows;
  if (!kras.length) return '<p class="empty">No KRA data yet. It appears after the first sync.</p>';
  const year = yearInfo(d.kras, now);
  const maxOut = Math.max.apply(null, kras.map(function (k) { return Number(k.out_of) || 0; }));
  const tile = function (name, sec) {
    return '<div class="panel tile"><div class="eyebrow">' + name + '</div><div class="tile-num">' + fmtPts(sec.points) + '<span>/' + fmtPts(sec.out_of) + '</span></div>' +
      pbar(sec.out_of > 0 ? sec.points / sec.out_of * 100 : 0) + '<div class="tile-cap">' + sec.met + ' of ' + sec.rows.length + ' met</div></div>';
  };
  const anyPace = kras.some(function (k) { return paceOf(k, now) != null; });
  const trend = trendChart(d.snapshots || []);
  return '<div class="board">' +
    '<div class="side' + (trend ? '' : ' no-trend') + '">' +
      '<section class="panel hero" aria-label="KRA total">' +
        '<div class="eyebrow">KRA total</div>' +
        '<div class="hero-num">' + fmtPts(t.all.points) + '<span>%</span></div>' +
        meter(t.all.points, year ? year.elapsed : null, fmtPts(t.all.points) + ' of 100' + (year ? '; ' + Math.round(year.elapsed * 100) + '% of the KRA year has passed' : '')) +
        (year ? '<div class="hero-cap"><span><span class="tick-key"></span>' + Math.round(year.elapsed * 100) + '% of the KRA year gone</span><span>' + year.daysLeft + ' days left</span></div>' : '') +
      '</section>' +
      '<div class="tiles">' + tile('KRAs', t.kra) + tile('Required', t.required) + tile('Bonus', t.bonus) + '</div>' +
      (trend ? '<section class="panel trend" aria-label="KRA total by day"><div class="trend-head"><span class="eyebrow">KRA total by day</span></div>' + trend + '</section>' : '') +
    '</div>' +
    '<section class="panel ktable" aria-label="Key Result Areas">' +
      '<div class="khead"><span></span><span>Key Result Area</span><span>Progress to goal' + (anyPace ? '<span class="key"><span class="tick-key"></span>on pace today</span>' : '') + '</span><span>Points</span></div>' +
      '<div class="krows">' + kras.map(function (k) { return kraRow(k, now, maxOut); }).join('') + '</div>' +
    '</section>' +
  '</div>';
}

// ---------- Screen 2: required & bonus ----------

function itemValue(k) {
  if (k.kind === 'boolean') return k.current == null ? 'Not reported' : k.current ? 'Done' : 'Not done';
  const cur = fmtValue(k, 'current');
  const goal = fmtValue(k, 'goal');
  if (cur == null) return 'Not reported' + (goal == null ? ' · no goal set' : ' · goal ' + goal);
  return goal == null ? cur + ' · no goal set' : k.goal === 0 ? cur + ' · goal ' + goal : cur + ' of ' + goal;
}

function renderList(title, sec, now) {
  const items = sec.rows.map(function (k) {
    const st = statusOf(k, now);
    return '<li class="item s-' + st.key + '">' + ICONS[st.key] +
      '<span class="item-name">' + esc(k.name) + '<span class="item-val">' + esc(itemValue(k)) + (k.note ? ' · ' + esc(k.note) : '') + '<span class="sr-only">, ' + st.label + '</span></span></span>' +
      '<span class="item-pts">' + fmtPts(k.points) + '<span>/' + fmtPts(k.out_of) + '</span></span></li>';
  }).join('');
  return '<section class="panel list-block" aria-label="' + esc(title) + '">' +
    '<header class="list-head"><div class="list-top"><h2>' + esc(title) + '</h2><span class="list-total">' + fmtPts(sec.points) + '<span>/' + fmtPts(sec.out_of) + ' pts</span></span></div>' +
      pbar(sec.out_of > 0 ? sec.points / sec.out_of * 100 : 0) + '<div class="list-count">' + sec.met + ' of ' + sec.rows.length + ' met</div></header>' +
    (sec.rows.length ? '<ul class="items">' + items + '</ul>' : '<p class="empty" style="padding:.75rem 0">Nothing listed.</p>') +
  '</section>';
}

function renderRequired(d, now) {
  const t = totals(d.kras);
  if (!t.required.rows.length && !t.bonus.rows.length) return '<p class="empty">No required or bonus items yet. They appear after the first sync.</p>';
  return '<div class="lists">' + renderList('Annually required', t.required, now) + renderList('Bonus', t.bonus, now) + '</div>';
}

// ---------- Screen 3: this week ----------

function eventsOn(events, dayStart) {
  const dayEnd = addDays(dayStart, 1).getTime(), start = dayStart.getTime(), key = ymd(dayStart);
  const out = [];
  events.forEach(function (e) {
    if (e.all_day) {
      const s = e.starts_at.slice(0, 10), en = e.ends_at ? e.ends_at.slice(0, 10) : '';
      if (s <= key && key < (en > s ? en : ymd(addDays(new Date(s + 'T12:00:00'), 1)))) out.push({ e: e, rank: 0, sort: 0, label: '' });
      return;
    }
    const s = Date.parse(e.starts_at), en = e.ends_at ? Date.parse(e.ends_at) : s;
    if (!(s < dayEnd && (en > start || (en === s && s >= start)))) return;
    let label, rank = 2;
    if (s >= start && en <= dayEnd) label = en > s ? fmtRange(new Date(s), new Date(en)) : fmtTime(new Date(s));
    else if (s < start && en > dayEnd) { label = 'All day'; rank = 1; }
    else if (s < start) { label = 'Until ' + fmtTime(new Date(en)); rank = 1; }
    else label = 'From ' + fmtTime(new Date(s));
    out.push({ e: e, rank: rank, sort: s, label: label });
  });
  return out.sort(function (a, b) { return a.rank - b.rank || a.sort - b.sort || a.e.title.localeCompare(b.e.title); });
}

let weekEvents = []; // the events on screen, so a tap can open one

function renderWeek(d, now) {
  weekEvents = [];
  const today = startOfDay(now);
  const days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(today, i); });
  const cols = days.map(function (day, i) {
    const evs = eventsOn(d.events || [], day);
    const name = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : day.toLocaleDateString('en-US', { weekday: 'long' });
    const items = evs.map(function (x) {
      // Members can tap an event for its details; the TV has nobody to tap it.
      const tap = TV ? '' : ' data-ev="' + (weekEvents.push(x.e) - 1) + '" tabindex="0" role="button"';
      return x.e.all_day
        ? '<li class="ev ev-allday"' + tap + '><span class="ev-title">' + esc(x.e.title) + '</span></li>'
        : '<li class="ev"' + tap + '><span class="ev-time">' + esc(x.label) + '</span><span class="ev-title">' + esc(x.e.title) + '</span>' + (x.e.location ? '<span class="ev-loc">' + esc(x.e.location) + '</span>' : '') + '</li>';
    }).join('');
    return '<section class="panel day' + (i === 0 ? ' is-today' : '') + '" aria-label="' + esc(name) + ', ' + esc(fmtDay(day)) + '">' +
      '<header class="day-head"><span class="dow">' + esc(name) + '</span><span class="date">' + esc(fmtDay(day)) + '</span></header>' +
      (evs.length ? '<ul class="evs">' + items + '</ul><p class="more" hidden></p>' : '<p class="empty-day">Nothing scheduled</p>') +
    '</section>';
  }).join('');
  return '<div class="week-head"><h2>This week</h2><span class="range">' + esc(fmtDay(days[0])) + ' – ' + esc(fmtDay(days[6])) + '</span><div class="nextup" id="nextup"></div></div>' +
    '<div class="week">' + cols + '</div>';
}

// ---------- Event details (members) ----------

const LONG_DAY = { weekday: 'long', month: 'long', day: 'numeric' };
function hoursText(mins) { return mins < 60 ? mins + ' min' : Math.floor(mins / 60) + ' h' + (mins % 60 ? ' ' + (mins % 60) + ' min' : ''); }

/** The day line, the time line, and when the event starts and ends. */
function eventWhen(e) {
  if (e.all_day) {
    const s = e.starts_at.slice(0, 10), en = e.ends_at ? e.ends_at.slice(0, 10) : '';
    const first = new Date(s + 'T12:00:00');
    const last = en > s ? addDays(new Date(en + 'T12:00:00'), -1) : first; // the stored end date is the day after
    const one = ymd(first) === ymd(last);
    return {
      main: first.toLocaleDateString('en-US', LONG_DAY) + (one ? '' : ' – ' + last.toLocaleDateString('en-US', LONG_DAY)),
      sub: 'All day', start: startOfDay(first).getTime(), end: addDays(startOfDay(last), 1).getTime(),
    };
  }
  const s = new Date(e.starts_at), en = e.ends_at ? new Date(e.ends_at) : s;
  const mins = Math.round((en - s) / 60e3);
  let time = fmtTime(s);
  if (mins > 0) time = s.toDateString() === en.toDateString() ? fmtRange(s, en) : fmtTime(s) + ' – ' + fmtDay(en) + ', ' + fmtTime(en);
  return { main: s.toLocaleDateString('en-US', LONG_DAY), sub: time + (mins > 0 ? ' · ' + hoursText(mins) : ''), start: s.getTime(), end: Math.max(en.getTime(), s.getTime() + 1) };
}

function eventStatus(w, now) {
  if (now >= w.start && now < w.end) return 'Happening now';
  if (now >= w.end) return 'Ended';
  const mins = Math.max(1, Math.round((w.start - now) / 60e3));
  if (mins < 1440) return 'Starts in ' + hoursText(mins);
  const days = Math.round(mins / 1440);
  return 'Starts in ' + days + ' day' + (days === 1 ? '' : 's');
}

/** A location is a web address (link to it) or a place (link to a map). */
function locationHtml(loc) {
  const t = String(loc).trim();
  const web = /^https?:\/\/\S+$/i.test(t) ? t : /^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(\/\S*)?$/i.test(t) ? 'https://' + t : null;
  return '<div class="pop-main">' + esc(t) + '</div>' + (web
    ? '<a href="' + esc(web) + '" target="_blank" rel="noopener noreferrer">Open link</a>'
    : '<a href="https://maps.apple.com/?q=' + encodeURIComponent(t) + '" target="_blank" rel="noopener noreferrer">Open in Maps</a>');
}

let popFrom = null;
function closeEvent() {
  const el = $('event-pop');
  if (!el) return;
  el.parentNode.removeChild(el);
  document.body.classList.remove('pop-open');
  if (popFrom && popFrom.focus && document.body.contains(popFrom)) popFrom.focus();
  popFrom = null;
}

function openEvent(e, from) {
  closeEvent();
  const w = eventWhen(e);
  const status = eventStatus(w, Date.now());
  const back = document.createElement('div');
  back.className = 'pop-back';
  back.id = 'event-pop';
  back.innerHTML = '<div class="pop" role="dialog" aria-modal="true" aria-label="' + esc(e.title) + '">' +
    '<div class="pop-top"><h2>' + esc(e.title) + '</h2><button class="pop-close" type="button" aria-label="Close">&times;</button></div>' +
    '<span class="pop-status' + (status === 'Happening now' ? ' is-now' : '') + '">' + esc(status) + '</span>' +
    '<div class="pop-row"><div class="eyebrow">When</div><div class="pop-main">' + esc(w.main) + '</div><div class="pop-sub">' + esc(w.sub) + '</div></div>' +
    (e.location ? '<div class="pop-row"><div class="eyebrow">Where</div>' + locationHtml(e.location) + '</div>' : '') +
  '</div>';
  back.addEventListener('click', function (ev) {
    if (ev.target === back || (ev.target.closest && ev.target.closest('.pop-close'))) closeEvent();
  });
  document.body.appendChild(back);
  document.body.classList.add('pop-open');
  popFrom = from || null;
  back.querySelector('.pop-close').focus();
}

// ---------- Next event ----------

function nextUpHtml(events, now) {
  let cur = null, next = null;
  (events || []).forEach(function (e) {
    if (e.all_day) return;
    const s = Date.parse(e.starts_at), en = e.ends_at ? Date.parse(e.ends_at) : s;
    if (s <= now && en > now) { if (!cur) cur = e; }
    else if (s > now && s - now < 7 * DAY_MS && (!next || s < Date.parse(next.starts_at))) next = e;
  });
  const e = cur || next;
  if (!e) return '';
  const s = Date.parse(e.starts_at);
  let meta;
  if (cur) meta = 'Until ' + fmtTime(new Date(Date.parse(e.ends_at)));
  else {
    const dayDiff = Math.round((startOfDay(s) - startOfDay(now)) / DAY_MS);
    const dayName = dayDiff === 0 ? 'Today' : dayDiff === 1 ? 'Tomorrow' : new Date(s).toLocaleDateString('en-US', { weekday: 'long' });
    const mins = Math.max(1, Math.round((s - now) / 60e3));
    const inText = mins < 60 ? mins + ' min' : mins < 24 * 60 ? Math.floor(mins / 60) + ' h' + (mins % 60 ? ' ' + (mins % 60) + ' min' : '') : Math.round(mins / 1440) + ' days';
    meta = dayName + ' ' + fmtTime(new Date(s)) + ' · in ' + inText;
  }
  if (e.location) meta += ' · ' + e.location;
  return '<div class="nu"><span class="nu-label">' + (cur ? 'Happening now' : 'Next up') + '</span><span class="nu-body"><span class="nu-title">' + esc(e.title) + '</span><span class="nu-meta">' + esc(meta) + '</span></span></div>';
}

function renderNextUp(now) {
  const el = $('nextup');
  if (!el) return;
  const html = state.data ? nextUpHtml(state.data.events, now) : '';
  if (el.innerHTML !== html) el.innerHTML = html;
}

// ---------- Rankings ----------

/** The chapter's place in nationals' KRA ranking, from tke.org's public rankings page. */
function ranksHtml(r, now) {
  if (!r || r.national_rank == null) return '';
  const item = function (label, rank, total) {
    return '<div class="rk-item"><span class="rk-label">' + esc(label) + '</span><span class="rk-num">#' + fmtNum(rank, 0) + (total ? '<span> of ' + fmtNum(total, 0) + '</span>' : '') + '</span></div>';
  };
  const age = r.updated_at ? now - Date.parse(r.updated_at) : 0;
  return '<div class="rk">' + item('National rank', r.national_rank, r.national_total) +
    (r.region_rank != null ? item('Region ' + r.region + ' rank', r.region_rank, r.region_total) : '') +
    // Only said when the ranks are stale (the rankings page couldn't be read for over a day).
    (age > 36 * 3600e3 ? '<div class="rk-moves"><span class="rk-move">Ranks as of ' + esc(fmtDay(new Date(r.updated_at))) + '</span></div>' : '') + '</div>';
}

function renderRanks(now) {
  const el = $(TV ? 'ranks-tv' : 'ranks-m');
  const html = state.data ? ranksHtml(state.data.rank, now) : '';
  if (el.innerHTML !== html) el.innerHTML = html;
}

// ---------- Header, notices, render ----------

function updatedText(d, now) {
  if (!d) return state.error ? 'Waiting for data' : 'Loading…';
  if (d.source === 'sample') return 'Sample data from Oct 30, 2026';
  if (!d.lastOk) return 'Not synced yet';
  const t = Date.parse(d.lastOk.ran_at);
  const mins = Math.max(0, Math.round((now - t) / 60e3));
  const hours = Math.round(mins / 60);
  return 'Updated ' + (mins < 1 ? 'just now' : mins < 90 ? mins + ' min ago' : hours < 48 ? hours + ' h ago' : Math.round(hours / 24) + ' days ago');
}

function noticeList(d, now) {
  const out = [];
  if (keyProblem) out.push(['bad', 'This page has a secret Supabase key in CONFIG. Remove it, rotate the key in Supabase, and use the publishable key instead.']);
  else if (d && d.source === 'sample') out.push(['info', 'Sample data, not live numbers.']);
  if (state.error) out.push(['warn', d ? "Can't reach the database. Showing data from " + fmtWhen(state.lastGoodAt) + '. Retrying.' : "Can't reach the database. Retrying."]);
  if (d && d.source === 'live') {
    if (!d.lastOk) out.push(['warn', 'No successful sync yet.']);
    else if (now - Date.parse(d.lastOk.ran_at) > STALE_MS) out.push(['warn', 'This data is ' + Math.floor((now - Date.parse(d.lastOk.ran_at)) / 3600e3) + ' hours old. The hourly sync may be stuck.']);
    if (d.lastRun && !d.lastRun.ok) out.push(['warn', 'The last sync failed (' + fmtWhen(d.lastRun.ran_at) + '): ' + trim(d.lastRun.message, TV ? 110 : 220)]);
  }
  return out;
}

function renderAll() {
  const now = Date.now();
  const d = state.data;
  $('updated').textContent = updatedText(d, now);
  $('notices').innerHTML = noticeList(d, now).map(function (n) { return '<div class="notice ' + n[0] + '">' + esc(n[1]) + '</div>'; }).join('');
  renderRanks(now);
  const blank = { kras: [], events: [], snapshots: [] };
  const renderers = [renderKras, renderRequired, renderWeek];
  sceneEls.forEach(function (el, i) {
    if (!renderers[i]) return; // the Goals and Board screens draw themselves
    try { el.innerHTML = renderers[i](d || blank, now); } catch (err) {
      console.error(err);
      el.innerHTML = "<p class=\"empty\">Couldn't draw this screen. The rest of the dashboard still works.</p>";
    }
  });
  renderNextUp(now);
  wireCharts();
  fitTv();
  if (!TV) document.dispatchEvent(new Event('dash:data'));
}

// TV only: make each screen fit without scrolling.
function overflows(el) {
  const boxes = el.querySelectorAll('.krow, .list-block, .side');
  for (let i = 0; i < boxes.length; i++) if (boxes[i].scrollHeight > boxes[i].clientHeight + 1) return true;
  return el.scrollHeight > el.clientHeight + 1;
}
function fitTv() {
  if (!TV) return;
  const levels = ['tight', 'tighter'];
  sceneEls.forEach(function (el) {
    levels.forEach(function (l) { el.classList.remove(l); });
    for (let i = 0; i < levels.length && overflows(el); i++) el.classList.add(levels[i]);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.day'), function (day) {
    const list = day.querySelector('.evs'), more = day.querySelector('.more');
    if (!list || !more) return;
    const items = Array.prototype.slice.call(list.children);
    let hiddenCount = 0;
    while (list.scrollHeight > list.clientHeight + 1 && hiddenCount < items.length - 1) {
      more.hidden = false;
      items[items.length - 1 - hiddenCount].hidden = true;
      hiddenCount++;
      more.textContent = '+' + hiddenCount + ' more';
    }
  });
}

// ---------- Data ----------

function secretKeyIn(key) {
  if (!key) return null;
  if (/^sb_secret_/.test(key)) return 'secret';
  if (key.split('.').length === 3) {
    try {
      const payload = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      if (payload.role === 'service_role') return 'service_role';
    } catch (e) { /* not a JWT we can read; let the API decide */ }
  }
  return null;
}

function fetchWithTimeout(url, opts) {
  const o = Object.assign({ cache: 'no-store' }, opts);
  let timer = 0;
  if (window.AbortController) {
    const ctrl = new AbortController();
    o.signal = ctrl.signal;
    timer = setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS);
  }
  const done = function () { clearTimeout(timer); };
  return fetch(url, o).then(function (r) { done(); return r; }, function (e) { done(); throw e; });
}

async function api(query) {
  const key = CONFIG.supabaseAnonKey;
  const headers = { apikey: key, Accept: 'application/json' };
  if (!/^sb_/.test(key)) headers.Authorization = 'Bearer ' + key; // legacy JWT anon keys
  const res = await fetchWithTimeout(CONFIG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/' + query, { headers: headers });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function loadLive(now) {
  const today = startOfDay(now);
  const from = encodeURIComponent(addDays(today, -1).toISOString());
  const to = encodeURIComponent(addDays(today, 8).toISOString());
  const got = await Promise.all([
    api('kras?select=*&order=section.asc,sort_order.asc'),
    api('events?select=*&starts_at=lt.' + to + '&ends_at=gt.' + from + '&order=starts_at.asc'),
    api('sync_runs?select=ran_at,ok,message&order=ran_at.desc&limit=1'),
    api('sync_runs?select=ran_at,ok,message&ok=eq.true&order=ran_at.desc&limit=1'),
  ]);
  let snapshots = [];
  try {
    for (let offset = 0; offset < 20000; offset += 1000) {
      const page = await api('kra_snapshots?select=day,kra_id,points&order=day.asc,kra_id.asc&limit=1000&offset=' + offset);
      snapshots = snapshots.concat(page);
      if (page.length < 1000) break;
    }
  } catch (e) { snapshots = []; } // history is a nice-to-have; never block the page on it
  let rank = null;
  try { rank = (await api('rankings?select=*&id=eq.kra'))[0] || null; } catch (e) { rank = null; } // so are the ranks
  return { source: 'live', kras: got[0], events: got[1], lastRun: got[2][0] || null, lastOk: got[3][0] || null, snapshots: snapshots, rank: rank };
}

function cacheSave(d) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data: d })); } catch (e) { /* storage may be off */ }
}
function cacheLoad() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
}

let refreshTimer = 0;
async function refresh() {
  clearTimeout(refreshTimer);
  const now = Date.now();
  state.lastAttempt = now;
  try {
    const d = SAMPLE ? sampleData(now) : await loadLive(now);
    state.data = d;
    state.error = null;
    state.lastGoodAt = now;
    state.failures = 0;
    if (!SAMPLE) cacheSave(d);
  } catch (err) {
    state.error = err;
    state.failures++;
    if (!state.data) {
      const cached = cacheLoad();
      if (cached && cached.data) { state.data = cached.data; state.lastGoodAt = cached.at; }
    }
  }
  renderAll();
  // Back off 30 s, 1, 2, 4 min… while the network is down, then every 5 min.
  const delay = state.error ? Math.min(REFRESH_MS, 30e3 * Math.pow(2, state.failures - 1)) : REFRESH_MS;
  refreshTimer = setTimeout(refresh, delay);
}

// ---------- Screens: tabs (members) and rotation (TV) ----------

let rotateTimer = 0;
function showScene(i, opts) {
  state.scene = (i + SCENES.length) % SCENES.length;
  const cur = SCENES[state.scene];
  const group = groupOf(cur.group);
  const stacked = isPhone() && group && group.stack;
  SCENES.forEach(function (s, j) {
    const on = j === state.scene || Boolean(stacked && s.group === cur.group);
    sceneEls[j].classList.toggle('is-active', on);
    if (TV) sceneEls[j].setAttribute('aria-hidden', String(!on));
    else {
      sceneEls[j].hidden = !on;
      const tab = $('tab-' + s.id);
      if (tab) { tab.setAttribute('aria-selected', String(j === state.scene)); tab.tabIndex = j === state.scene ? 0 : -1; }
    }
  });
  if (!TV) {
    if (cur.group) lastInGroup[cur.group] = cur.id;
    $('ranks-m').classList.toggle('not-kra', cur.group !== 'kra');
    GROUPS.forEach(function (g) { $('gtab-' + g.id).setAttribute('aria-selected', String(g.id === cur.group)); });
    // The Goals | Board switch (any group with more than one screen that isn't stacked).
    const mates = group && !group.stack ? SCENES.filter(function (s) { return s.group === group.id; }) : [];
    $('subtabs').innerHTML = mates.length > 1 ? mates.map(function (s) {
      return '<button class="subtab" role="tab" type="button" data-scene="' + s.id + '" aria-selected="' + (s.id === cur.id) + '">' + esc(s.label) + '</button>';
    }).join('') : '';
    if (opts && opts.fromUser) history.replaceState(null, '', '#' + cur.id);
    // A tab starts at the top; in the stacked KRA tab a link to "required" goes to that part.
    if (opts && opts.fromUser) window.scrollTo(0, stacked && cur.id !== 'kras' ? sceneEls[state.scene].offsetTop - 8 : 0);
    if (cur.app) loadApp();
    document.dispatchEvent(new CustomEvent('dash:scene', { detail: cur.id }));
    return;
  }
  Array.prototype.forEach.call($('rotation').children, function (el, j) {
    el.classList.toggle('is-active', j === state.scene);
    el.classList.toggle('is-paused', state.paused);
    if (j === state.scene) { const f = el.querySelector('.rot-fill'); f.style.animation = 'none'; void f.offsetWidth; f.style.animation = ''; }
  });
  clearTimeout(rotateTimer);
  if (!state.paused) rotateTimer = setTimeout(function () { showScene(state.scene + 1); }, ROTATE_S * 1000);
}

// Members only: sign-in and the Goals and Board screens live in Dashboard/app/.
// They use newer browser features than the TV's browser has, so the TV never loads them.
let appLoading = false;
function loadApp() {
  if (TV || SAMPLE || appLoading) return;
  appLoading = true;
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'app/app.css';
  document.head.appendChild(css);
  const add = function (src, type, next) {
    const el = document.createElement('script');
    el.src = src;
    if (type) el.type = type;
    el.onload = next || null;
    el.onerror = function () { appLoading = false; };
    document.body.appendChild(el);
  };
  add('app/vendor/supabase.js', '', function () { add('app/vendor/sortable.min.js', '', function () { add('app/app.js', 'module'); }); });
}

function sceneFrom(value) {
  const id = String(value || '').replace('#', '').split('/')[0];
  for (let i = 0; i < SCENES.length; i++) if (SCENES[i].id === id) return i;
  return 0;
}

function setUpMembers() {
  const tabs = $('tabs');
  const tabbed = SCENES.filter(function (s) { return !s.noTab; });
  const go = function (id) { showScene(sceneFrom(id), { fromUser: true }); };
  // Desktop: one tab per screen.
  tabs.innerHTML = tabbed.map(function (s) {
    return '<button class="tab' + (s.locked ? ' needs-recruit' : '') + '" role="tab" id="tab-' + s.id + '" aria-controls="scene-' + s.id + '" type="button">' + esc(s.label) + '</button>';
  }).join('');
  tabbed.forEach(function (s) { $('tab-' + s.id).addEventListener('click', function () { go(s.id); }); });
  tabs.addEventListener('keydown', function (e) {
    const at = tabbed.indexOf(SCENES[state.scene]);
    const to = { ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: tabbed.length - 1 }[e.key];
    if (to == null || at < 0) return;
    e.preventDefault();
    const next = tabbed[(to + tabbed.length) % tabbed.length];
    go(next.id);
    $('tab-' + next.id).focus();
  });
  // Phone: three tabs; each opens the screen you last had open in it.
  $('gtabs').innerHTML = GROUPS.map(function (g) {
    return '<button class="gtab' + (g.locked ? ' needs-recruit' : '') + '" role="tab" id="gtab-' + g.id + '" type="button"><svg viewBox="0 0 24 24" aria-hidden="true">' + g.icon + '</svg>' + esc(g.label) + '</button>';
  }).join('');
  GROUPS.forEach(function (g) {
    $('gtab-' + g.id).addEventListener('click', function () {
      const first = SCENES.filter(function (s) { return s.group === g.id; })[0].id;
      go(g.stack ? first : lastInGroup[g.id] || first);
    });
  });
  $('subtabs').addEventListener('click', function (e) {
    const b = e.target.closest ? e.target.closest('[data-scene]') : null;
    if (b) go(b.getAttribute('data-scene'));
  });
  // Tap (or Enter / Space on) a calendar event to see its details.
  const eventFrom = function (target) {
    const el = target.closest ? target.closest('#scene-week [data-ev]') : null;
    return el ? { el: el, event: weekEvents[Number(el.getAttribute('data-ev'))] } : null;
  };
  $('scene-week').addEventListener('click', function (ev) {
    const hit = eventFrom(ev.target);
    if (hit && hit.event) openEvent(hit.event, hit.el);
  });
  addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') return closeEvent();
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const hit = eventFrom(ev.target);
    if (hit && hit.event && ev.target === hit.el) { ev.preventDefault(); openEvent(hit.event, hit.el); }
  });
  // Turning the phone, or resizing the window across the phone width, regroups the screens.
  if (window.matchMedia) {
    const mq = matchMedia('(max-width: 700px)');
    const regroup = function () { showScene(state.scene); };
    if (mq.addEventListener) mq.addEventListener('change', regroup); else if (mq.addListener) mq.addListener(regroup);
  }
  addEventListener('hashchange', function () { showScene(sceneFrom(location.hash)); });
  setInterval(function () { renderNextUp(Date.now()); $('updated').textContent = updatedText(state.data, Date.now()); }, 30e3);
  showScene(params.has('scene') ? sceneFrom(params.get('scene')) : sceneFrom(location.hash));
}

function setUpTv() {
  $('rotation').innerHTML = SCENES.map(function (s) { return '<div class="rot-item" style="--dur:' + (ROTATE_S || 30) + 's"><span>' + esc(s.label) + '</span><span class="rot-track"><span class="rot-fill"></span></span></div>'; }).join('');
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') showScene(state.scene + 1);
    else if (e.key === 'ArrowLeft') showScene(state.scene - 1);
    else if (e.key === ' ' && ROTATE_S) { state.paused = !state.paused; showScene(state.scene); }
  });

  // Clock, "Updated" time and the next-event countdown.
  const tick = function () {
    const d = new Date();
    $('clock-time').textContent = timeFmt.format(d);
    $('clock-date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    $('updated').textContent = updatedText(state.data, d.getTime());
    renderNextUp(d.getTime());
  };
  tick();
  setInterval(tick, 15e3);

  // Burn-in: nudge the whole layout a few pixels to a new spot every hour.
  const SHIFTS = [[0, 0], [5, 3], [-4, 5], [3, -4], [-5, -2], [2, 5], [-3, -5], [4, 1]];
  const shift = function () {
    const s = SHIFTS[Math.floor(Date.now() / 3600e3) % SHIFTS.length];
    $('stage').style.transform = 'translate(' + s[0] * 0.06 + 'rem, ' + s[1] * 0.06 + 'rem)';
  };
  shift();
  setInterval(shift, 60e3);

  // Full reload every 6 h to pick up new versions, but only when the site
  // answers, so a Wi-Fi drop never leaves the TV on a browser error page.
  const tryReload = function () {
    if (navigator.onLine === false) return setTimeout(tryReload, 5 * 60e3);
    fetchWithTimeout(location.href, {}).then(function (res) {
      if (res.ok) location.reload(); else setTimeout(tryReload, 5 * 60e3);
    }, function () { setTimeout(tryReload, 5 * 60e3); });
  };
  setTimeout(tryReload, RELOAD_MS);

  // Keep the screen awake where the browser allows it.
  const wake = function () { try { if (navigator.wakeLock && !document.hidden) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) { /* unsupported */ } };
  wake();
  document.addEventListener('visibilitychange', wake);

  let resizeTimer = 0;
  addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitTv, 200); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTv);

  showScene(sceneFrom(params.get('scene')));
}

// ---------- Sample data (?sample) ----------
// The rows on nationals' KRA page on Oct 30, 2026, with made-up history and events.

const SAMPLE_ROWS = {
  // [name, result, goal, points, out of, met, cumulative]
  kra: [
    ['Initiates', '0', '15', 0, 25, false, true],
    ['Finances', '$0.00', '$0.00', 15, 15, true],
    ['RLC Attendance', '0', '12', 0, 15, false],
    ['Risk Mgmt Education', '29', '29', 10, 10, true],
    ['EDU.TKE.org Usage', '27', '150', 0.9, 5, false],
    ['Philanthropy', '$0.00', '$8,000.00', 0, 5, false, true],
    ['Phired Up', '0', '15', 0, 5, false],
    ['Service', '520.00', '1300', 2, 5, false, true],
    ['St. Jude Dollars', '$165.00', '$8,000.00', 0.1, 5, false, true],
  ],
  required: [
    ['Academics', 'N/A', '3', 0, 3, false],
    ['Alumni Engagement', '4', '1', 3, 3, true],
    ['Annual Report', 'False', 'True', 0, 2, false],
    ['Ritual Equip. Check', 'False', 'True', 0, 2, false],
    ['Chapter Advisor', 'N/A', 'True', 0, 1, false],
  ],
  bonus: [
    ['Forum Attendance', '0', '15', 0, 3, false],
    ['Foundation Donors', '6', '15', 0, 3, false],
    ['Money Vehicle', '0', '', 0, 3, false],
    ['Membership Growth', 'N/A', '1', 0, 1, false],
  ],
};

function sampleValue(t) {
  t = (t || '').trim();
  if (!t || /^n\/?a$/i.test(t)) return null;
  if (/^true$/i.test(t)) return 1;
  if (/^false$/i.test(t)) return 0;
  const n = Number(t.replace(/[$,%\s]/g, ''));
  return isFinite(n) ? n : null;
}

function sampleData(now) {
  const kras = [];
  Object.keys(SAMPLE_ROWS).forEach(function (section) {
    SAMPLE_ROWS[section].forEach(function (r, i) {
      const kind = /^(true|false)$/i.test(r[1]) || /^(true|false)$/i.test(r[2]) ? 'boolean' : (r[1] + r[2]).indexOf('$') >= 0 ? 'currency' : 'number';
      kras.push({
        id: section + '-' + r[0].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
        section: section, name: r[0], kind: kind, result_text: r[1], goal_text: r[2],
        current: sampleValue(r[1]), goal: sampleValue(r[2]), points: r[3], out_of: r[4], met: r[5], sort_order: i,
        term_start: r[6] ? '2026-06-01' : null, due_date: r[6] ? '2027-05-31' : null, note: null,
      });
    });
  });

  // Weekly steps since the start of the semester, ending at today's values.
  const snapshots = [];
  const start = new Date(2026, 7, 24), end = startOfDay(now);
  const span = Math.max(1, Math.round((end - start) / DAY_MS));
  for (let day = 0; day <= span; day++) {
    const f = day === span ? 1 : Math.pow(Math.floor(day / 7) * 7 / span, 1.3);
    const date = ymd(addDays(start, day));
    kras.forEach(function (k) { snapshots.push({ day: date, kra_id: k.id, points: round2(k.points * Math.min(1, f)) }); });
  }

  // A plausible week, placed relative to today so it always has something on it.
  const today = startOfDay(now);
  const inDays = function (dow) { return (dow - today.getDay() + 7) % 7; };
  const at = function (offset, h, m) { return new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset, h, m || 0).toISOString(); };
  const timed = function (title, offset, h1, m1, h2, m2, loc) { return { id: title + offset, title: title, starts_at: at(offset, h1, m1), ends_at: at(offset, h2, m2), all_day: false, location: loc || null }; };
  const allDay = function (title, offset, n) { return { id: title + offset, title: title, starts_at: ymd(addDays(today, offset)) + 'T00:00:00.000Z', ends_at: ymd(addDays(today, offset + (n || 1))) + 'T00:00:00.000Z', all_day: true, location: null }; };
  const events = [
    timed('Chapter meeting', inDays(0), 19, 0, 20, 30, 'Chapter room'),
    timed('Executive board', inDays(3), 20, 0, 21, 0, 'Chapter room'),
    timed('Brotherhood night', inDays(4), 20, 0, 22, 0),
    timed('Beach cleanup', inDays(6), 9, 0, 12, 0, 'Paradise Beach Park'),
    timed('St. Jude stream', inDays(5), 18, 0, 23, 0, 'twitch.tv/taukappaepsilon_on'),
    timed('Study hours', inDays(2), 18, 0, 21, 0, 'Evans Library'),
    timed('Recruitment table', inDays(2), 11, 0, 14, 0, 'Student Union'),
    allDay('Homecoming weekend', inDays(5), 3),
    allDay('Election day', inDays(2)),
  ];

  const synced = new Date(now - 23 * 60e3).toISOString();
  const rank = { national_rank: 92, national_total: 208, region: '2', region_rank: 30, region_total: 52, since_yesterday: 24, since_week: -7, prev_year_rank: 37, updated_at: synced };
  return { source: 'sample', kras: kras, events: events, snapshots: snapshots, rank: rank, lastRun: { ran_at: synced, ok: true, message: '' }, lastOk: { ran_at: synced, ok: true, message: '' } };
}

// ---------- Start ----------

// What Dashboard/app/ needs from this page.
window.DASH = {
  config: CONFIG,
  icons: ICONS,
  meter: meter,
  data: function () { return state.data; },
  scene: function () { return SCENES[state.scene].id; },
  show: function (id) { showScene(sceneFrom(id), { fromUser: true }); },
  setRecruit: function (on) { document.documentElement.classList.toggle('can-recruit', Boolean(on)); },
};

if (TV) setUpTv(); else setUpMembers();
refresh();
if (!TV && !SAMPLE) setTimeout(loadApp, 400); // so the account button shows on every tab
addEventListener('online', function () { refresh(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && Date.now() - state.lastAttempt > 60e3) refresh();
});
</script>
